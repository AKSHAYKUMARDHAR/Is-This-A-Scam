# Backup wake-up for the free Render instance. The app keeps itself awake by pinging its own public
# URL every 10 minutes (KEEP_AWAKE in checker/config.py); this workflow only matters if the instance
# has fallen asleep anyway, e.g. after a restart. GitHub runs scheduled workflows on a best-effort
# basis and often skips them, which is why it is not the main mechanism. /healthz never calls the
# model, so pings cost no Gemini quota.
name: keep-alive
on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"   # off the top of the hour, when GitHub drops the most scheduled runs
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ping the live app
        run: curl -fsS --retry 3 --retry-delay 10 --max-time 90 https://is-this-a-scam.onrender.com/healthz

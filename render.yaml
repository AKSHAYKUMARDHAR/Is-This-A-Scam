# One-click deploy on Render (free plan): use the "Deploy to Render" button in the README,
# sign in with GitHub, paste GEMINI_API_KEY, and press Apply.
services:
  - type: web
    name: is-this-a-scam
    runtime: docker
    plan: free
    region: singapore          # closest Render region to India
    healthCheckPath: /healthz
    envVars:
      - key: GEMINI_API_KEY
        sync: false            # Render asks for this value when you deploy
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_RPM
        value: "10"
      - key: STATS_TOKEN
        generateValue: true
# Optional, each off until set in the Render dashboard (service > Environment), which redeploys:
#   DATABASE_URL           Postgres URL (e.g. a free Neon database in Singapore): keeps the usage
#                          log across redeploys; without it the log is a file that each deploy wipes.
#   SAFE_BROWSING_API_KEY  Google Safe Browsing key: a link on Google's phishing/malware list
#                          makes the verdict "Likely scam". Only the links are sent, never the message.

# One-click deploy on Render (free plan): New > Blueprint > pick this repo, then paste GEMINI_API_KEY.
services:
  - type: web
    name: is-this-a-scam
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_RPM
        value: "10"
      - key: STATS_TOKEN
        generateValue: true
